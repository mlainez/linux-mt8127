%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/mediatek,mt8127-mt6323.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaTek MT8127 sound card with the MT6323 codec

maintainers:
  - Marc Lainez <marc.lainez@gmail.com>

description:
  Sound card of MT8127 boards that use the codec of the MT6323 PMIC. The
  headphone outputs of the codec can also drive an external speaker
  amplifier, and a GPIO can report the jack switch.

properties:
  compatible:
    const: mediatek,mt8127-mt6323

  model:
    $ref: /schemas/types.yaml#/definitions/string
    description: User specified audio sound card name

  mediatek,platform:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The phandle of the MT8127 audio front-end.

  mediatek,audio-codec:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The phandle of the MT6323 audio codec node.

  spk-en-gpios:
    maxItems: 1
    description: Enable line of the external speaker amplifier.

  hp-det-gpios:
    maxItems: 1
    description: Headphone jack switch, asserted while a plug is inserted.

required:
  - compatible
  - mediatek,platform
  - mediatek,audio-codec

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    sound {
        compatible = "mediatek,mt8127-mt6323";
        model = "Lenovo Tab3 7";
        mediatek,platform = <&afe>;
        mediatek,audio-codec = <&mt6323_codec>;
        spk-en-gpios = <&pio 30 GPIO_ACTIVE_HIGH>;
        hp-det-gpios = <&pio 26 GPIO_ACTIVE_LOW>;
    };
